# PERFIL DE DESENVOLVIMENTO (LABORATÓRIO/H2)
# ==========================================

# 1. Configuração do H2 Database (Banco em Memória)
spring.datasource.url=jdbc:h2:mem:glowupdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=validate

# 2. Template de Integração - Mercado Pago (Sandbox)
# Preencher localmente, NÃO subir as chaves reais para o GitHub
mercado-pago.access-token=SUA_CHAVE_DE_TESTE_AQUI
mercado-pago.public-key=SUA_CHAVE_PUBLICA_AQUI

