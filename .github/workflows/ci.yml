name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    # Banco real para o teste que sobe o contexto Spring + Flyway (pega erros como tabela sem migration)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: glowup
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/glowup
      DB_USER: postgres
      DB_PASS: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/glowup
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compila e roda todos os testes (inclui o contexto com banco)
        working-directory: api
        run: mvn -B verify
