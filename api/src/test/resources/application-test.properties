# Configuração usada SOMENTE nos testes (perfil "test").
# Garante que o contexto Spring suba mesmo se as variáveis de ambiente não chegarem.
# No CI, o Postgres do job (localhost:5432) responde com estes mesmos valores.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/glowup}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Valores de teste (não são segredos reais)
api.security.token.secret=segredo-somente-para-testes-com-mais-de-32-caracteres-0123456789
glowup.cors.allowed-origins=http://localhost:5500
glowup.pagamento.mock-enabled=true
glowup.notificacoes.email-habilitado=false
