# ---------------------------------------------------------
# BANCO DE DADOS (POSTGRESQL)
# ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/glowup}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------
# HIBERNATE / JPA
# ---------------------------------------------------------
# O Flyway criará as tabelas. O Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logar as queries no terminal para debug durante o desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# SERIALIZAÇÃO JSON
# ---------------------------------------------------------
spring.jackson.time-zone=America/Sao_Paulo