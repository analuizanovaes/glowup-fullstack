<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowUp - Meu Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-dark: #4A1942;
      --text-muted: #7D6B78;
      --primary-pink: #E85D9E;
      --primary-hover: #D44687;
      --badge-bg: #FCE8F3;
      --border-color: #E8CEDD;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #fffeff 0%, #fffeff 50%, #e2ccf3 90%);
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid rgba(232, 206, 221, 0.4);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--badge-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-dark);
    }
    .logo-text span {
      color: var(--primary-pink);
    }
    .search-bar {
      flex: 1;
      max-width: 400px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      font-size: 0.85rem;
      outline: none;
      background-color: #FAFAFA;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .search-bar svg {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }
    .layout-container {
      display: flex;
      flex: 1;
    }
    aside {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid rgba(232, 206, 221, 0.4);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .sidebar-section-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding-left: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.75rem;
      border-radius: 50px;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .sidebar-link svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }
    .sidebar-link:hover, .sidebar-link.active {
      background-color: var(--badge-bg);
      color: var(--primary-pink);
    }
    .sidebar-link:hover svg, .sidebar-link.active svg {
      color: var(--primary-pink);
    }
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(232, 206, 221, 0.4);
    }
    .maintenance-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 0.6rem 1rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary-pink);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 0.7rem;
      border-radius: 50px;
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
    }
    main {
      flex: 1;
      padding: 2.5rem;
      overflow-y: auto;
    }
    .page-header {
      margin-bottom: 2rem;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-dark);
    }
    .page-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .profile-card {
      background: #ffffff;
      border-radius: 1.5rem;
      padding: 2rem;
      border: 1px solid rgba(232, 206, 221, 0.5);
      box-shadow: 0 10px 25px rgba(74, 25, 66, 0.04);
      max-width: 600px;
    }
    .profile-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dark);
    }
    .form-input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 50px;
      font-size: 0.85rem;
      outline: none;
      background-color: #FAFAFA;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-dark);
    }
    .form-input:focus {
      border-color: var(--primary-pink);
    }
    .btn-primary {
      background-color: var(--primary-pink);
      color: #ffffff;
      border: none;
      padding: 0.75rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(232, 93, 158, 0.3);
      width: 100%;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo-container">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 18C8 19.6569 9.79086 21 12 21C14.2091 21 16 19.6569 16 18H8Z" fill="#E85D9E"/>
          <path d="M12 18V10" stroke="#E85D9E" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="7" r="2" fill="#E85D9E"/>
        </svg>
      </div>
      <span class="logo-text">Glow<span>Up</span></span>
    </a>
    <div class="search-bar">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Buscar pedidos, clientes e produtos">
    </div>
  </header>

  <div class="layout-container">
    <aside>
      <div>
        <span class="sidebar-section-title">Gestão Domingas</span>
        <nav class="sidebar-menu">
          <a href="visao-geral.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Visão geral
          </a>
          <a href="pedidos.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Pedidos
          </a>
          <a href="devolucoes.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
            Devoluções
          </a>
          <a href="produtos.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Produtos
          </a>
          <a href="crm.html" class="sidebar-link">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            CRM Reposição
          </a>
          <a href="meuperfil.html" class="sidebar-link active">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Meu Perfil
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="maintenance-toggle">
          <span>Modo manutenção</span>
          <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
        <a href="login.html" class="logout-btn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Sair / Logout
        </a>
      </div>
    </aside>

    <main>
      <div class="page-header">
        <h1 class="page-title">Meu Perfil</h1>
        <p class="page-subtitle">Atualize os dados da administradora.</p>
      </div>

      <div class="profile-card">
        <form class="profile-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Nome completo</label>
              <input type="text" class="form-input" value="Domingas Ferreira">
            </div>
            <div class="form-group">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-input" value="(61) 99999-0000">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-input" value="domingas@glowup.com">
            </div>
            <div class="form-group">
              <label class="form-label">Data de nascimento</label>
              <input type="text" class="form-input" value="12/04/1980">
            </div>
          </div>
          <div style="margin-top: 0.5rem;">
            <button type="submit" class="btn-primary">Salvar alterações</button>
          </div>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
