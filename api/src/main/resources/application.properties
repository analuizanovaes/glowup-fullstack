# ---------------------------------------------------------
# BANCO DE DADOS (POSTGRESQL)
# ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/glowup}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------
# HIBERNATE / JPA
# ---------------------------------------------------------
# TODO: Retornar para 'validate' assim que a equipe entregar os scripts do Flyway
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logar as queries no terminal para debug durante o desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# SERVIDOR E NUVEM (RENDER)
# ---------------------------------------------------------
# O Render injeta a porta dinamicamente; 8080 serve como fallback no ambiente local
server.port=${PORT:8080}

# ---------------------------------------------------------
# SEGURANÇA E JWT
# ---------------------------------------------------------
# Chave secreta de assinatura. O valor real será cadastrado apenas no painel do Render
api.security.token.secret=${JWT_SECRET:chave_secreta_padrao_para_o_ambiente_de_desenvolvimento_local}

# ---------------------------------------------------------
# SERVIÇO DE E-MAIL (SMTP)
# ---------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:seu_email_aqui@gmail.com}
spring.mail.password=${MAIL_PASS:senha_de_app_aqui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------
# SERIALIZAÇÃO JSON
# ---------------------------------------------------------
spring.jackson.time-zone=America/Sao_Paulo